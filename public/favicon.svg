<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Graduation cap top (diamond) -->
  <polygon points="16,5 28,11 16,13.5 4,11" fill="white"/>
  <!-- Cap center button -->
  <circle cx="16" cy="9" r="1.8" fill="url(#gold)"/>
  <!-- Cap stem -->
  <rect x="14.5" y="13.5" width="3" height="5.5" fill="rgba(255,255,255,0.88)"/>
  <!-- Cap platform / mortarboard base -->
  <rect x="11" y="19" width="10" height="4.5" rx="1.5" fill="rgba(255,255,255,0.88)"/>
  <!-- Tassel -->
  <line x1="26" y1="11" x2="26" y2="17" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="26" cy="18.5" r="2" fill="url(#gold)"/>
  <!-- Gold accent bar -->
  <rect x="6" y="25.5" width="20" height="2" rx="1" fill="url(#gold)"/>
</svg>
